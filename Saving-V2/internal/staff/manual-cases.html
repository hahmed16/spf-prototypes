<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحالات اليدوية - مساحة العمل الداخلية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="../../assets/css/app.css">
    <link rel="stylesheet" href="../../assets/css/shell.css">
    
</head>
<body data-root="../../" data-user-role="staff">
<main class="spf-main">
<div class="page-header">
            <div>
                <h4>إدارة الحالات اليدوية والاستثنائية</h4>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="../../internal/staff/index.html">لوحة التحكم</a></li>
                        <li class="breadcrumb-item active">الحالات اليدوية</li>
                    </ol>
                </nav>
            </div>
            <div class="user-info-badge">
                <span class="current-role-badge badge user-type-badge staff">موظف الصندوق</span>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-4"><div class="metric-card"><div class="metric-label">إجمالي الحالات المفتوحة</div><div class="metric-value">12</div></div></div>
            <div class="col-md-4"><div class="metric-card"><div class="metric-label">تجاوزت المدة المحددة</div><div class="metric-value">3</div></div></div>
            <div class="col-md-4"><div class="metric-card"><div class="metric-label">بانتظار مستندات</div><div class="metric-value">4</div></div></div>
        </div>

        <div class="section-card">
            <div class="section-title">قائمة الحالات الاستثنائية</div>
            <div class="table-responsive">
                <table class="table dense-table align-middle">
                    <thead>
                        <tr>
                            <th>نوع الحالة</th>
                            <th>صاحب العلاقة</th>
                            <th>السبب</th>
                            <th>المدة المحددة</th>
                            <th>المسؤول</th>
                            <th>الحالة</th>
                            <th>الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="manualCasesRows"></tbody>
                </table>
            </div>
        </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/prototype-core.js"></script>
<script src="../../assets/js/internal-shell.js"></script>
<script>
const manualCases = [
            { id: 1, type: 'فشل جلب الحساب البنكي', owner: 'محمد إقبال', reason: 'تعطل تكامل ملاءة', sla: '2 يوم', officer: 'مروان السالمي', status: 'قيد المعالجة' },
            { id: 2, type: 'تحويل بعد المغادرة', owner: 'راجيش كومار', reason: 'بيانات تحويل ناقصة', sla: 'متجاوز', officer: 'خالد البلوشي', status: 'بانتظار مستندات' },
            { id: 3, type: 'مدخر غير عماني متوفى', owner: 'جوزيف ماثيو', reason: 'حصر الورثة غير مكتمل', sla: '5 أيام', officer: 'سعاد الراشدية', status: 'قيد المعالجة' },
            { id: 4, type: 'فقدان شرط الاشتراك', owner: 'أحمد إسماعيل', reason: 'إخطار متأخر بالخروج', sla: '3 أيام', officer: 'خالد البلوشي', status: 'مفتوحة' }
        ];
        let activeCase = null;
        const modal = new bootstrap.Modal(document.getElementById('manualCaseModal'));

        function renderManualCases() {
            document.getElementById('manualCasesRows').innerHTML = manualCases.map(item => `
                <tr>
                    <td class="fw-700">${item.type}</td>
                    <td>${item.owner}</td>
                    <td>${item.reason}</td>
                    <td>${item.sla === 'متجاوز' ? '<span class="status-chip danger">متجاوز</span>' : item.sla}</td>
                    <td>${item.officer}</td>
                    <td><span class="status-chip ${item.status === 'بانتظار مستندات' ? 'pending' : 'info'}">${item.status}</span></td>
                    <td><button class="btn btn-sm btn-spf-outline" onclick="openManualCase(${item.id})">إدارة الحالة</button></td>
                </tr>
            `).join('');
        }

        function openManualCase(id) {
            activeCase = manualCases.find(item => item.id === id);
            document.getElementById('manualCaseDetails').innerHTML = `
                <div class="detail-item"><div class="detail-label">نوع الحالة</div><div class="detail-value">${activeCase.type}</div></div>
                <div class="detail-item"><div class="detail-label">صاحب العلاقة</div><div class="detail-value">${activeCase.owner}</div></div>
                <div class="detail-item"><div class="detail-label">سبب التحويل اليدوي</div><div class="detail-value">${activeCase.reason}</div></div>
                <div class="detail-item"><div class="detail-label">الحالة الحالية</div><div class="detail-value">${activeCase.status}</div></div>
            `;
            document.getElementById('assignedOfficer').value = activeCase.officer;
            document.getElementById('nextManualStatus').value = activeCase.status;
            document.getElementById('manualNotes').value = '';
            modal.show();
        }

        function saveManualCase() {
            activeCase.officer = document.getElementById('assignedOfficer').value;
            activeCase.status = document.getElementById('nextManualStatus').value;
            renderManualCases();
            modal.hide();
            spf.showSuccess('تم تحديث الحالة اليدوية بنجاح.');
        }

        renderManualCases();
</script>
</body>
</html>
